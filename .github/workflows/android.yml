name: Build Android APK from Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Package Web App to APK
      run: |
        npx web-to-apk init --yes || true
        npx web-to-apk build
        mkdir -p output && cp *.apk output/app-release.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: billing-software-apk
        path: |
          *.apk
          output/app-release.apk
