name: Build Android APK via Capacitor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Assets
      uses: actions/checkout@v4

    - name: Initialize Java Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize Runtime Node Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install and Build Android App wrapper
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Billing App" "com.vishwacoding.billingapp" --web-dir=.
        npx cap add android
        npx cap sync
        cd android && chmod +x gradlew && ./gradlew assembleDebug

    - name: Deliver Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: billing-software-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
